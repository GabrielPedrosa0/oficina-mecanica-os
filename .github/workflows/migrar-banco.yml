# Aplica no Supabase as migrações novas de banco/migracoes/ quando elas chegam na main.
# Precisa do secret DATABASE_URL no repositório (Settings -> Secrets and variables -> Actions).
name: Migrar banco

on:
  push:
    branches: [main]
    paths:
      - "banco/migracoes/**"
      - "banco/modelo_logico_oficina.sql"
  workflow_dispatch:

# Uma execução por vez: duas não tentam aplicar a mesma migração.
concurrency:
  group: migrar-banco
  cancel-in-progress: false

jobs:
  migrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r backend/requirements.txt

      - name: Aplicar migrações
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m database.migrar
